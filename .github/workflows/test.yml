name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: regression gate (make test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scipy
      - run: make test

  riscv:
    name: RV32IMAFDC build + instruction count
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y clang lld llvm
      - run: pip install unicorn pyelftools
      - run: make rv | tee rv.log
      - name: CPU budget summary
        run: grep -E "MIPS|text" rv.log >> "$GITHUB_STEP_SUMMARY"
